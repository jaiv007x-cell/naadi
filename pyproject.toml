[project]
name = "naadi"
version = "0.1.0"
description = "NAADI - Neural Allied-health Adaptive Diagnostic Intelligence"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "openai>=1.40",
    "structlog>=24.1",
    "python-multipart",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "asyncpg",
    "orjson",
    "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-randomly", "ruff", "mypy", "httpx"]
speech = [
    "faster-whisper>=1.0",
    "TTS>=0.22",
    "soundfile>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services/pratibimb/tests", "services/pratibimb/auth/tests"]
markers = [
    "h_acceptance: Phase H rung-3 acceptance suite (H.a + H.b + H.c.1 + H.c.2)",
    "i_acceptance: Phase I alternate-rubric (ARP) acceptance suite",
    "samvaad_acceptance: SAMVAAD.a enforcement + reference rubrics + matcher spec suite",
    "samvaad_b_acceptance: SAMVAAD.b rubric corpus + summative capture + runtime stubs",
    "samvaad_c_acceptance: SAMVAAD.c Nirikshak merge + ledger summative projector + verify route",
]

[tool.ruff]
line-length = 100
target-version = "py311"
